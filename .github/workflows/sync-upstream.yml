
name: Sync with upstream

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync ${{ matrix.branch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        branch:
          - main
          - dev
          - "2.1.0"

    steps:
      - name: Checkout fork branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream branch
        run: |
          git remote add upstream https://github.com/luskaner/ageServer.git
          git fetch upstream "${{ matrix.branch }}"

      - name: Merge upstream changes
        run: |
          git merge --no-edit "upstream/${{ matrix.branch }}"

      - name: Push changes to fork
        run: |
          git push origin "HEAD:refs/heads/${{ matrix.branch }}"
